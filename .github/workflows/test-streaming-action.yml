name: Test CloudSealed AI Firewall

on:
  workflow_dispatch:
    inputs:
      simulated_cost:
        description: '🔥 Daily Spend Spike to Simulate (USD) - Watch the AI block the pipeline!'
        required: true
        default: '1500.00'
      baseline_context:
        description: '📊 FinOps Context'
        required: false
        default: 'Comparing against 30-day accumulated baseline'

jobs:
  test-cost-profiler:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Run CloudSealed Profiler
        uses: ./streaming-profiler
        with:
          current_cost_usd: ${{ github.event.inputs.simulated_cost }}
          window_size: 10
          z_threshold: 3.5
