name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package with dev + api extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[api,dev]"

      - name: Run test suite
        run: pytest -q

      - name: Reproduce the masking benchmark
        run: python benchmarks/masking_benchmark.py --check
