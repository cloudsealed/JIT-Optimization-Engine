name: 'CloudSealed Cost Profiler (Streaming)'
description: 'Protects your CI/CD pipeline from massive billing anomalies using Numba-accelerated Streaming MAD algorithms.'
author: 'CloudSealed'
branding:
  icon: 'shield'
  color: 'blue'

inputs:
  window_size:
    description: 'Sliding window size for median absolute deviation'
    required: false
    default: '30'
  z_threshold:
    description: 'Modified Z-Score threshold to trigger a halt'
    required: false
    default: '3.5'
  current_cost_usd:
    description: 'The estimated or actual cost of the current pipeline step'
    required: true

runs:
  using: 'composite'
  steps:
    - name: Install Dependencies
      shell: bash
      run: pip install numpy numba

    - name: Run Pipeline Profiler
      shell: bash
      run: |
        python -c "
        import sys, os
        sys.path.insert(0, os.path.abspath(os.path.join('${{ github.action_path }}', '..')))
        from cloudsealed_jit.pipeline_profiler import PipelineCostProfiler

        profiler = PipelineCostProfiler(window_size=${{ inputs.window_size }}, z_threshold=${{ inputs.z_threshold }})
        cost = float('${{ inputs.current_cost_usd }}')
        result = profiler.observe_and_score(cost)
        
        is_anomaly = result.get('is_anomaly')
        z_score = result.get('z_score')
        
        # Gerar Relatório Visual em Markdown
        status_icon = '🛑 **BLOQUEADO: Anomalia Severa**' if is_anomaly else '✅ **Custo Normal**'
        
        report = f'''
        ## 🛡️ CloudSealed JIT Cost Profiler
        
        {status_icon}
        
        | Métrica | Valor |
        |---|---|
        | Custo Identificado | **${cost:.2f}** |
        | Z-Score (Desvio) | **{z_score:.2f}** |
        | Threshold Permitido | {${{ inputs.z_threshold }}} |
        
        > Protegido por [CloudSealed JIT-Optimization-Engine](https://github.com/cloudsealed/JIT-Optimization-Engine).
        '''
        
        with open('cloudsealed_report.md', 'w') as f:
            f.write(report)
            
        if is_anomaly:
            print('::error::[CloudSealed] Cost Anomaly Detected!')
            with open('exit_status.txt', 'w') as f: f.write('1')
        else:
            with open('exit_status.txt', 'w') as f: f.write('0')
        "

    - name: Post PR Comment
      if: github.event_name == 'pull_request'
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        gh pr comment ${{ github.event.pull_request.number }} --body-file cloudsealed_report.md || echo "Não foi possível postar no PR."

    - name: Enforce Pipeline Halt
      shell: bash
      run: |
        STATUS=$(cat exit_status.txt)
        exit $STATUS
